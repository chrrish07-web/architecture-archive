<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARCHIVE · 건축 레퍼런스</title><link rel="stylesheet" href="style.css"><body>
<header><div class="wrap bar"><b class="brand"><i>▧</i> ARCHIVE</b><span class="status">●　로컬 저장소</span><button class="primary add">＋ 레퍼런스 추가</button></div></header>
<main class="wrap"><section id="home"><div class="heading"><div><small>REFERENCE LIBRARY</small><h1>레퍼런스 아카이브</h1></div><span id="count"></span></div>
<div id="empty" hidden><div class="welcome"><div class="drawing"><img src="drawing.svg" alt="제도대 위 건축 모형과 컴퍼스의 청사진"></div><div class="intro"><small>MY ARCHIVE</small><h2>아직 저장된<br>레퍼런스가 없습니다.</h2><p>첫 번째 레퍼런스를 추가해 보세요.</p><button class="primary add">＋ 첫 번째 레퍼런스 추가하기</button></div></div>
<div class="features"><article><i>▧</i><div><h3>이미지 · URL 저장</h3><p>발견한 이미지와 링크를 출처와 함께 모아보세요.</p></div></article><article><i>⊞</i><div><h3>건축 카테고리 분류</h3><p>형태, 공간, 재료, 조명으로 자료를 정리하세요.</p></div></article><article><i>▤</i><div><h3>브라우저 로컬 보관</h3><p>저장한 자료를 이 브라우저에서 다시 열어보세요.</p></div></article></div></div>
<div id="browse" hidden><div class="controls"><input id="search" type="search" aria-label="레퍼런스 검색" maxlength="80" placeholder="레퍼런스를 검색하세요"><select id="projectFilter" aria-label="프로젝트 필터"></select><button id="reset">초기화</button></div><div id="chips" class="chips"></div><p id="results"></p><div id="grid"></div></div></section>
<section id="detail" hidden></section><p id="failure" role="alert"></p></main><nav><button id="archiveNav">아카이브</button><button class="primary add">＋ 등록</button><button id="projectNav">프로젝트</button></nav>
<dialog><form novalidate><div class="bar"><h2>새 레퍼런스 추가</h2><button type="button" class="close" aria-label="닫기">×</button></div><p>레퍼런스를 등록할 방법을 선택하세요.</p><div class="tabs"><button type="button" id="imageTab">이미지 업로드</button><button type="button" id="urlTab">URL 등록</button></div>
<label class="drop" id="drop"><img id="preview" alt="선택한 이미지" hidden><strong id="fileLabel">이미지를 끌어오거나 파일을 선택하세요</strong><span>JPG, PNG, WEBP · 최대 10MB</span><input type="file" id="file" accept="image/jpeg,image/png,image/webp"></label>
<label id="urlField" hidden>레퍼런스 URL<input type="url" id="url" maxlength="2048" placeholder="https://"></label>
<label>레퍼런스 제목 <span id="counter">0/80</span><input id="titleInput" maxlength="80" placeholder="레퍼런스 제목을 입력하세요"></label><label>자료 출처<input id="source" maxlength="200" placeholder="예: Pinterest, ArchDaily"></label><p class="note">새 자료는 ‘미분류’와 ‘프로젝트 미지정’으로 저장됩니다.</p><div id="error" role="alert"></div><div class="actions"><button type="button" class="close">취소</button><button class="primary" id="save">저장하기</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
